<!-- Modal Éxito -->
<div class="modal fade" id="modalExito" tabindex="-1" aria-labelledby="modalExitoLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <div class="modal-header border-0 pb-0 justify-content-end">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body text-center pb-5 px-4 px-md-5">
        <div class="mb-4">
          <!-- Icono Check Verde -->
          <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#8CC63F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
        <h4 class="fw-bold mb-3 text-corporate-blue">¡Enviado con éxito!</h4>
        <p class="text-muted mb-4">Tu solicitud ha sido enviada correctamente. Nos pondremos en contacto contigo a la brevedad.</p>
        <button type="button" class="btn btn-primary px-5 py-2 rounded-pill fw-bold text-dark" data-bs-dismiss="modal">Aceptar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Error -->
<div class="modal fade" id="modalError" tabindex="-1" aria-labelledby="modalErrorLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <div class="modal-header border-0 pb-0 justify-content-end">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body text-center pb-5 px-4 px-md-5">
        <div class="mb-4">
          <!-- Icono Error Rojo -->
          <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#dc3545" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <h4 class="fw-bold mb-3 text-corporate-blue">Ocurrió un problema</h4>
        <p class="text-muted mb-4" id="textoError">Hubo un error al procesar tu solicitud.</p>
        <button type="button" class="btn btn-secondary px-5 py-2 rounded-pill fw-bold" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
