<!doctype html>
<html lang="es">

    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/logo_blanco.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        
        <!-- SEO Básico por defecto para desarrollo -->
        <title>Biolitycs Lab | Artículo</title>
        <meta name="description" content="Descubre nuestros últimos artículos e investigaciones en Biolitycs Lab." />
        <meta name="robots" content="index, follow" />
        <meta name="theme-color" content="#003865" />

        <!-- Variable vacía por defecto para que JS no falle en local -->
        <script>
            window.INITIAL_NOTICIA_DATA = null;
        </script>
    </head>

    <body class="bg-light">

        <load src="/src/components/navbar.html" />

        <main class="py-5 mt-5">
            <div id="detalle-noticia" class="container py-5 min-vh-100">
                <!-- Spinner por si JS tarda en cargar -->
                <div class="text-center py-5 mt-5">
                    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                    <p class="mt-3 text-muted fw-semibold">Cargando artículo...</p>
                </div>
            </div>
        </main>

        <load src="/src/components/footer.html" />
        <load src="/src/components/modals.html" />

        <script type="module" src="/src/main.js"></script>
        <script type="module" src="/src/js/detalle.js"></script>
    </body>

</html>
